[project]
name = "expkit"
version = "0.1.0"
description = "An A/B testing and experimentation framework: design, power analysis, frequentist + Bayesian inference, sequential testing, and validity checks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Raveesh Raj" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30", "plotly>=5.18"]
dev = ["pytest>=7.0", "matplotlib>=3.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
